name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build'
        required: true
        default: 'v2.0.3'

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Prepare GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: gh release create "$env:RELEASE_TAG" --draft --title "$env:RELEASE_TAG" --notes "Release $env:RELEASE_TAG"

      - name: Build and publish full version
        run: npm run build:full && npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIANA_API_BASE_URL: ${{ secrets.VIANA_API_BASE_URL }}

      - name: Build and publish trial version
        run: npm run build:trial && npx electron-builder --win --x64 --config electron-builder.trial.json --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIANA_API_BASE_URL: ${{ secrets.VIANA_API_BASE_URL }}
